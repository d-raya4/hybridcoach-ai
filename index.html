<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HybridCoach AI</title>
<style>
  :root {
    --bg: #0b1120;
    --card: #151f32;
    --card-2: #0f172a;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #22c55e;
    --warn: #f59e0b;
    --danger: #ef4444;
    --border: #273449;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.4; padding-bottom: 84px; }

  /* TOP BAR COMPACTA */
  header {
    background: rgba(11, 17, 32, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .brand { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 6px; }
  .brand span { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 6px; }

  /* CONTROLES TÁCTILES */
  select, input, button {
    background: var(--card-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 0.92rem;
    min-height: 40px;
  }
  input[type="number"] { text-align: center; font-weight: 600; }
  button {
    cursor: pointer;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: transform 0.06s, background 0.15s;
  }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); color: #051b26; border-color: var(--accent); }
  button.success { background: var(--accent-2); color: #042411; border-color: var(--accent-2); }
  button.warn { background: var(--warn); color: #241300; border-color: var(--warn); }
  button.danger { background: rgba(239,68,68,0.14); color: #fca5a5; border-color: rgba(239,68,68,0.35); }
  button.ghost { background: transparent; border-color: var(--border); color: var(--muted); }
  button.sm { min-height: 34px; padding: 5px 10px; font-size: 0.82rem; border-radius: 8px; }
  button.icon-btn { min-height: 36px; width: 36px; padding: 0; font-size: 1rem; }

  /* LAYOUT Y TARJETAS */
  main { max-width: 760px; margin: 0 auto; padding: 14px; }
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.15s ease; }
  @keyframes fadeIn { from { opacity: 0.6; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 14px;
  }
  .card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .card h2, .card h3 { margin: 0; font-size: 1rem; }
  .muted { color: var(--muted); font-size: 0.82rem; }

  /* RESUMEN HOY (DASHBOARD RÁPIDO) */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
  .kpi-box {
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 6px;
    text-align: center;
  }
  .kpi-val { font-size: 1.05rem; font-weight: 800; color: var(--text); }
  .kpi-lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }

  .progress-bar { height: 9px; background: var(--card-2); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0%; transition: width 0.25s; }

  /* STEPPERS +- PARA MÓVIL */
  .stepper {
    display: inline-flex;
    align-items: center;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .stepper button {
    border: none;
    background: transparent;
    min-height: 36px;
    width: 34px;
    padding: 0;
    font-size: 1.1rem;
    color: var(--accent);
    border-radius: 0;
  }
  .stepper input {
    border: none;
    background: transparent;
    width: 54px;
    min-height: 36px;
    padding: 2px;
    font-size: 0.92rem;
    border-radius: 0;
  }

  /* CHIPS / PILLS DE SELECCIÓN RÁPIDA */
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.82rem;
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--muted);
    min-height: 34px;
  }
  .chip.active { background: rgba(56,189,248,0.16); border-color: var(--accent); color: var(--text); }

  /* FILAS DE SERIES Y ALIMENTOS */
  .set-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(39,52,73,0.7);
  }
  .set-row:last-child { border-bottom: none; }

  .food-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 8px;
    border-bottom: 1px solid rgba(39,52,73,0.7);
  }
  .food-item:last-child { border-bottom: none; }

  .diag-pill {
    margin-top: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 0.83rem;
    background: rgba(56,189,248,0.1);
    border-left: 3px solid var(--accent);
  }
  .diag-pill.up { background: rgba(34,197,94,0.12); border-left-color: var(--accent-2); }
  .diag-pill.warn { background: rgba(245,158,11,0.12); border-left-color: var(--warn); }

  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    background: rgba(148,163,184,0.15);
    color: var(--muted);
  }
  .badge.brand { background: rgba(56,189,248,0.15); color: #7dd3fc; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select { width: 100%; }

  /* BARRA DE NAVEGACIÓN INFERIOR (TIPO APP NATIVA) */
  nav.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 68px;
    background: rgba(11, 17, 32, 0.97);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    z-index: 40;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-item {
    background: transparent;
    border: none;
    border-radius: 0;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 0.74rem;
    font-weight: 600;
    padding: 4px;
    min-height: 100%;
  }
  .nav-item .ico { font-size: 1.25rem; line-height: 1; }
  .nav-item.active { color: var(--accent); }

  /* MODAL Y TOAST */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.72);
    display: none; align-items: flex-end; justify-content: center; z-index: 60;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card); border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0; width: 100%; max-width: 600px;
    max-height: 85vh; overflow-y: auto; padding: 18px;
    animation: slideUp 0.18s ease;
  }
  @keyframes slideUp { from { transform: translateY(30px); } to { transform: none; } }

  .toast {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    background: #0f172a; color: var(--text); border: 1px solid var(--accent);
    padding: 9px 15px; border-radius: 999px; font-size: 0.83rem; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 90; display: none; white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <div class="brand">⚡ <span>HybridCoach</span></div>
  <div class="header-right">
    <select id="weekSelect" class="sm" style="min-height:34px; padding:4px 8px;" onchange="changeWeek(this.value)"></select>
    <button class="sm ghost" onclick="duplicateNextWeek()" title="Nueva semana">+Sem</button>
    <button class="sm ghost" onclick="openBackupModal()" title="Copia de seguridad">💾</button>
  </div>
</header>

<main>
  <!-- ==================== VISTA 1: HOY (ACCESO RÁPIDO) ==================== -->
  <section id="panel-hoy" class="panel active">
    <div class="card">
      <div class="card-header">
        <div>
          <h2 id="todayTitle">Hoy</h2>
          <div class="muted" id="todaySubtitle">Resumen dinámico del día</div>
        </div>
        <select id="quickDayType" class="sm" style="min-height:34px;" onchange="updateTodayContext()">
          <option value="gym">🏋️ Gimnasio</option>
          <option value="sport">⚽ Deporte</option>
          <option value="rest">🛌 Descanso</option>
        </select>
      </div>

      <!-- PASOS CON BOTONES RÁPIDOS -->
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--card-2); padding:10px 12px; border-radius:12px; border:1px solid var(--border); margin-bottom:10px;">
        <div>
          <div style="font-size:0.78rem; color:var(--muted);">👟 Pasos hoy</div>
          <div style="font-size:1.1rem; font-weight:800;" id="todayStepsDisplay">9.000</div>
        </div>
        <div style="display:flex; gap:5px;">
          <button class="sm ghost" onclick="addSteps(-1000)">-1k</button>
          <button class="sm ghost" onclick="addSteps(1000)">+1k</button>
          <button class="sm primary" onclick="addSteps(2500)">+2.5k</button>
        </div>
      </div>

      <!-- KPI CALORÍAS Y MACROS -->
      <div class="kpi-grid">
        <div class="kpi-box">
          <div class="kpi-val" id="kpiKcal">0</div>
          <div class="kpi-lbl" id="kpiKcalTarget">/ 2200 kcal</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val" id="kpiProt">0g</div>
          <div class="kpi-lbl" id="kpiProtTarget">Prot</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val" id="kpiCarbs">0g</div>
          <div class="kpi-lbl" id="kpiCarbsTarget">HC</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val" id="kpiFat">0g</div>
          <div class="kpi-lbl" id="kpiFatTarget">Grasa</div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="todayProgressFill"></div></div>
    </div>

    <!-- ATAJOS DE 1 TOQUE -->
    <div class="grid-2" style="margin-bottom:14px;">
      <button class="primary" style="height:48px;" onclick="switchTab('entreno')">🏋️ Ir a Entrenar</button>
      <button class="success" style="height:48px;" onclick="switchTab('comer')">🍽️ Apuntar Comida</button>
    </div>

    <!-- CONTEXTO RÁPIDO EN 1 LÍNEA -->
    <div class="card">
      <div class="card-header">
        <h3>Estado de la semana</h3>
        <button class="sm ghost" onclick="adjustPlanIncremental()">Aplicar ajuste</button>
      </div>
      <div class="grid-2">
        <div class="field" style="margin:0;">
          <label>💼 Trabajo</label>
          <select id="quickWork" onchange="updateTodayContext()">
            <option value="oficina">Oficina</option>
            <option value="mixto">Mixto / De pie</option>
            <option value="almacen">Almacén / Intenso</option>
            <option value="vacaciones">Vacaciones</option>
          </select>
        </div>
        <div class="field" style="margin:0;">
          <label>🩹 Molestia</label>
          <select id="quickPain" onchange="updateTodayContext()">
            <option value="ninguna">Ninguna</option>
            <option value="rodilla">Rodilla</option>
            <option value="hombro">Hombro</option>
            <option value="lumbar">Lumbar</option>
            <option value="fascitis">Pie / Fascitis</option>
          </select>
        </div>
      </div>
    </div>

    <!-- CONSUMIDO HOY (VISTA RÁPIDA) -->
    <div class="card">
      <div class="card-header">
        <h3>Comidas registradas hoy</h3>
        <span class="muted" id="todayLogCount">0 items</span>
      </div>
      <div id="todayLogsList"></div>
    </div>
  </section>

  <!-- ==================== VISTA 2: ENTRENO (CUADERNO ÁGIL) ==================== -->
  <section id="panel-entreno" class="panel">
    <div class="card" style="padding:12px;">
      <div style="display:flex; gap:8px; align-items:center;">
        <select id="sessionSelect" style="flex:1;" onchange="renderActiveSession()"></select>
        <button class="sm primary" onclick="addExerciseToSession()">+ Ejercicio</button>
        <button class="sm ghost" onclick="addCustomSession()">+ Sesión</button>
      </div>
    </div>
    <div id="sessionContainer"></div>
  </section>

  <!-- ==================== VISTA 3: COMER (REGISTRO + DIETA UNIFICADOS) ==================== -->
  <section id="panel-comer" class="panel">
    <!-- SUB-SELECTOR COMPACTO -->
    <div class="chip-row">
      <button class="chip active" id="subComerLog" onclick="toggleComerView('log')">⚡ Registro Rápido</button>
      <button class="chip" id="subComerPlan" onclick="toggleComerView('plan')">📋 Menú y Sustituciones</button>
      <button class="chip" id="subComerManual" onclick="toggleComerView('manual')">✍️ A Mano / Foto</button>
    </div>

    <!-- SUBVISTA A: BUSCADOR Y REGISTRO 1 TOQUE -->
    <div id="comerView-log">
      <div class="card">
        <div class="grid-2" style="margin-bottom:8px;">
          <select id="logMealSlot">
            <option>Desayuno</option>
            <option>Almuerzo</option>
            <option selected>Comida</option>
            <option>Merienda</option>
            <option>Cena</option>
          </select>
          <div style="display:flex; align-items:center; gap:6px;">
            <input type="number" id="logGrams" value="100" min="1" step="5" style="width:100%;" oninput="renderFoodList()">
            <span class="muted">g</span>
          </div>
        </div>
        <div class="chip-row" style="margin-bottom:8px;">
          <button class="sm ghost" onclick="setQuickGrams(50)">50g</button>
          <button class="sm ghost" onclick="setQuickGrams(100)">100g</button>
          <button class="sm ghost" onclick="setQuickGrams(150)">150g</button>
          <button class="sm ghost" onclick="setQuickGrams(200)">200g</button>
          <button class="sm ghost" onclick="setQuickGrams(250)">250g</button>
        </div>
        <div class="grid-2" style="margin-bottom:8px;">
          <input type="text" id="foodSearch" placeholder="🔍 Buscar alimento..." oninput="renderFoodList()">
          <select id="foodBrandFilter" onchange="renderFoodList()">
            <option value="ALL">Todas las marcas</option>
            <option value="Hacendado">Hacendado</option>
            <option value="Carrefour">Carrefour</option>
            <option value="Lidl">Lidl</option>
            <option value="Día">Día</option>
            <option value="Alcampo">Alcampo</option>
            <option value="Básicos">Básicos</option>
            <option value="Personalizado">Mis alimentos</option>
          </select>
        </div>
        <div id="foodListBox" style="max-height:330px; overflow-y:auto;"></div>
      </div>
    </div>

    <!-- SUBVISTA B: DIETA DINÁMICA Y SUSTITUCIONES -->
    <div id="comerView-plan" style="display:none;">
      <div class="card" style="padding:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <span class="muted" id="dietTargetMini">Objetivo dinámico</span>
          <button class="sm success" onclick="rebalanceRemainingMeals()">Auto-Cuadrar Día</button>
        </div>
      </div>
      <div id="mealsContainer"></div>
    </div>

    <!-- SUBVISTA C: A MANO Y FOTO -->
    <div id="comerView-manual" style="display:none;">
      <div class="card">
        <h3>Añadir A Mano</h3>
        <div class="field"><label>Nombre</label><input type="text" id="manualName" placeholder="Ej: Plato casero"></div>
        <div class="grid-2">
          <div class="field"><label>Gramos</label><input type="number" id="manualGrams" value="150" min="1"></div>
          <div class="field"><label>Kcal (vacío = auto)</label><input type="number" id="manualKcal" placeholder="Auto"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
          <div class="field"><label>Prot (g)</label><input type="number" id="manualProt" step="0.1" value="0"></div>
          <div class="field"><label>HC (g)</label><input type="number" id="manualCarbs" step="0.1" value="0"></div>
          <div class="field"><label>Grasa (g)</label><input type="number" id="manualFat" step="0.1" value="0"></div>
        </div>
        <div class="grid-2">
          <button class="primary" onclick="addManualToLog()">Registrar Hoy</button>
          <button class="ghost" onclick="saveManualToDB()">Guardar en BBDD</button>
        </div>
      </div>

      <div class="card">
        <h3>Estimar Plato por Foto</h3>
        <input type="file" id="photoInput" accept="image/*" style="width:100%; margin-bottom:8px;" onchange="previewPhoto(event)">
        <img id="photoPreview" alt="Plato" style="display:none; max-height:150px; border-radius:10px; margin-bottom:8px;">
        <div class="field"><label>Componentes visibles</label>
          <input type="text" id="photoDesc" placeholder="Ej: arroz, magro cerdo, pavo, tortilla">
        </div>
        <div class="field"><label>Peso estimado plato (g)</label>
          <input type="number" id="photoWeight" value="450" min="50" step="10">
        </div>
        <button class="warn" style="width:100%;" onclick="estimateFromPhoto()">Calcular Estimación</button>
        <div id="photoEstimateResult" style="margin-top:10px;"></div>
      </div>
    </div>
  </section>

  <!-- ==================== VISTA 4: AJUSTES Y SEMANA ==================== -->
  <section id="panel-ajustes" class="panel">
    <div class="card">
      <h3>Datos Base y Objetivo</h3>
      <div class="grid-2">
        <div class="field"><label>Sexo</label>
          <select id="f_sex"><option value="H">Hombre</option><option value="M">Mujer</option></select>
        </div>
        <div class="field"><label>Edad</label><input type="number" id="f_age"></div>
        <div class="field"><label>Peso (kg)</label><input type="number" id="f_weight" step="0.1"></div>
        <div class="field"><label>Estatura (cm)</label><input type="number" id="f_height"></div>
        <div class="field"><label>Objetivo</label>
          <select id="f_goal">
            <option value="definicion">Definición</option>
            <option value="recomposicion">Recomposición</option>
            <option value="mantenimiento">Mantenimiento</option>
            <option value="volumen">Volumen</option>
          </select>
        </div>
        <div class="field"><label>Días Gimnasio</label>
          <select id="f_gymDays" onchange="autoAssignSchedule()">
            <option value="3">3 días</option>
            <option value="4">4 días</option>
            <option value="5">5 días</option>
          </select>
        </div>
        <div class="field"><label>Deporte extra</label>
          <input type="text" id="f_sports" placeholder="Fútbol, Boxeo...">
        </div>
        <div class="field"><label>Deporte esta semana</label>
          <select id="f_sportPaused">
            <option value="activo">Activo</option>
            <option value="pausado">Pausado</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <button class="primary" onclick="generateOrUpdatePlan(false)">Guardar y Actualizar</button>
        <button class="danger" onclick="generateOrUpdatePlan(true)">Reiniciar Plan</button>
      </div>
    </div>

    <div class="card">
      <h3>Organización Semanal</h3>
      <div id="weekScheduleGrid"></div>
    </div>
  </section>
</main>

<!-- NAVEGACIÓN INFERIOR -->
<nav class="bottom-nav">
  <button class="nav-item active" data-tab="hoy" onclick="switchTab('hoy')">
    <span class="ico">⚡</span><span>Hoy</span>
  </button>
  <button class="nav-item" data-tab="entreno" onclick="switchTab('entreno')">
    <span class="ico">🏋️</span><span>Entreno</span>
  </button>
  <button class="nav-item" data-tab="comer" onclick="switchTab('comer')">
    <span class="ico">🍽️</span><span>Comer</span>
  </button>
  <button class="nav-item" data-tab="ajustes" onclick="switchTab('ajustes')">
    <span class="ico">⚙️</span><span>Ajustes</span>
  </button>
</nav>

<!-- MODAL -->
<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const STORAGE_KEY = "hybridcoach_ai_state_v1";
const DAYS_ES = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];

const DEFAULT_FOODS = [
  { id: "f1", name: "Pechuga de pollo", brand: "Básicos", kcal: 110, p: 22.0, c: 0.0, f: 2.1 },
  { id: "f2", name: "Magro de cerdo / lomo", brand: "Básicos", kcal: 159, p: 22.0, c: 0.0, f: 7.1 },
  { id: "f3", name: "Chuleta / filete de pavo", brand: "Básicos", kcal: 108, p: 21.5, c: 0.0, f: 2.0 },

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.foods || !parsed.foods.length) {
        parsed.foods = DEFAULT_FOODS;
      } else {
        const existingIds = new Set(parsed.foods.map(x => x.id));
        DEFAULT_FOODS.forEach(df => {
          if (!existingIds.has(df.id)) parsed.foods.push(df);
        });
      }
      return parsed;
    }
  } catch (e) {}
  return defaultState();
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.style.display = "none"; }, 2400);
}

function getWeekData(w = state.activeWeek) {
  if (!state.weeks[w]) {
    state.weeks[w] = {
      schedule: DAYS_ES.map((d, i) => ({ day: d, type: i % 2 === 0 ? "gym" : "rest", sportName: "" })),
      sessions: [],
      meals: [],
      logs: []
    };
  }
  return state.weeks[w];
}

function switchTab(tabId) {
  document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.tab === tabId));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + tabId));
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (tabId === "hoy") renderHoyTab();
  if (tabId === "entreno") renderRoutineTab();
  if (tabId === "comer") { renderFoodList(); renderDietTab(); }
  if (tabId === "ajustes") { syncFormFromState(); renderScheduleGrid(); }
}

function toggleComerView(sub) {
  ["log", "plan", "manual"].forEach(k => {
    document.getElementById("comerView-" + k).style.display = (k === sub) ? "block" : "none";
    document.getElementById("subComer" + k.charAt(0).toUpperCase() + k.slice(1)).classList.toggle("active", k === sub);
  });
  if (sub === "plan") renderDietTab();
}

function computeTargets() {
  const p = state.profile;
  const baseBmr = 10 * Number(p.weight) + 6.25 * Number(p.height) - 5 * Number(p.age) + (p.sex === "H" ? 5 : -161);
  const workBonus = p.work === "almacen" ? 420 : p.work === "mixto" ? 180 : p.work === "vacaciones" ? -80 : 0;
  const stepsBonus = Math.round((Number(p.steps || 0) - 5000) * 0.038);
  const sportBonus = (p.dayType === "sport" && !p.sportPausedWeek) ? 280 : 0;
  const gymBonus = p.dayType === "gym" ? 220 : 0;

  let tdee = Math.max(1500, Math.round(baseBmr * 1.2 + workBonus + stepsBonus + sportBonus + gymBonus));
  let kcal = tdee;
  if (p.goal === "definicion") kcal = Math.round(tdee - 450);
  else if (p.goal === "recomposicion") kcal = Math.round(tdee - 200);
  else if (p.goal === "volumen") kcal = Math.round(tdee + 300);

  const protein = Math.round(Number(p.weight) * (p.goal === "definicion" ? 2.1 : 1.9));
  const fat = Math.round((kcal * 0.27) / 9);
  const carbs = Math.max(50, Math.round((kcal - protein * 4 - fat * 9) / 4));

  return { kcal, protein, carbs, fat, tdee };
}

  const targets = computeTargets();

  document.getElementById("todayTitle").textContent = `${dayName} · Semana ${state.activeWeek}`;
  document.getElementById("todaySubtitle").textContent = `Objetivo: ${targets.kcal} kcal (P ${targets.protein}g · HC ${targets.carbs}g · G ${targets.fat}g)`;
  document.getElementById("quickDayType").value = p.dayType;
  document.getElementById("quickWork").value = p.work;
  document.getElementById("quickPain").value = p.pain;
  document.getElementById("todayStepsDisplay").textContent = Number(p.steps || 0).toLocaleString("es-ES");

  const tot = wd.logs.reduce((acc, l) => ({
    kcal: acc.kcal + Number(l.kcal || 0),
    p: acc.p + Number(l.p || 0),
    c: acc.c + Number(l.c || 0),
    f: acc.f + Number(l.f || 0)
  }), { kcal: 0, p: 0, c: 0, f: 0 });

  document.getElementById("kpiKcal").textContent = Math.round(tot.kcal);
  document.getElementById("kpiKcalTarget").textContent = `/ ${targets.kcal} kcal`;
  document.getElementById("kpiProt").textContent = `${Math.round(tot.p)}g`;
  document.getElementById("kpiProtTarget").textContent = `P / ${targets.protein}g`;
  document.getElementById("kpiCarbs").textContent = `${Math.round(tot.c)}g`;
  document.getElementById("kpiCarbsTarget").textContent = `HC / ${targets.carbs}g`;
  document.getElementById("kpiFat").textContent = `${Math.round(tot.f)}g`;
  document.getElementById("kpiFatTarget").textContent = `G / ${targets.fat}g`;

  const pct = Math.min(100, Math.round((tot.kcal / Math.max(1, targets.kcal)) * 100));
  document.getElementById("todayProgressFill").style.width = pct + "%";

  document.getElementById("todayLogCount").textContent = `${wd.logs.length} items`;
  document.getElementById("todayLogsList").innerHTML = wd.logs.length
    ? wd.logs.map((l, idx) => `
      <div class="food-item">

}

function renderRoutineTab() {
  const wd = getWeekData();
  if (!wd.sessions.length) {
    wd.sessions = buildGeneratedSessions(state.profile.gymDays, state.profile.pain);
    saveState();
  }
  const sel = document.getElementById("sessionSelect");
  const prevVal = sel.value;
  sel.innerHTML = wd.sessions.map((s, idx) => `<option value="${idx}">${s.title}</option>`).join("");
  if (prevVal !== "" && wd.sessions[Number(prevVal)]) sel.value = prevVal;
  renderActiveSession();
}

function diagnoseExercise(ex) {
  const reps = ex.repsDone || [];
  const rirs = ex.rirDone || [];
  const parts = ex.repRange.split("-").map(Number);
  const topRep = parts[1] || parts[0] || 12;
  const avgReps = reps.length ? reps.reduce((a, b) => a + Number(b || 0), 0) / reps.length : 0;
  const minRir = rirs.length ? Math.min(...rirs.map(x => Number(x ?? 2))) : 2;
  const extraLoad = state.profile.work === "almacen" || (!state.profile.sportPausedWeek && state.profile.sports);

  if (avgReps >= topRep && minRir >= 1) {
    const inc = ex.pattern === "squat" || ex.pattern === "hinge" ? 5 : 2.5;
    return { cls: "up", text: `🚀 Sube +${inc} kg la próxima sesión (cumples ${topRep} reps con margen).` };
  }
  if (extraLoad && minRir <= 0) {
    return { cls: "warn", text: `⚠️ Fatiga alta: mantén peso, deja 1-2 reps en recámara.` };
  }
  return { cls: "", text: `🎯 Consolida ${ex.repRange} reps (RIR ${ex.rirTarget}) antes de subir carga.` };
}

            <h3>${ex.name}</h3>

function stepWeight(sIdx, eIdx, delta) {
  const ex = getWeekData().sessions[sIdx].exercises[eIdx];
  ex.weight = Math.max(0, +(Number(ex.weight || 0) + delta).toFixed(1));
  saveState();
  renderActiveSession();
}

function stepSet(sIdx, eIdx, k, kind, delta) {
  const ex = getWeekData().sessions[sIdx].exercises[eIdx];
  if (kind === "reps") ex.repsDone[k] = Math.max(0, Number(ex.repsDone[k] || 0) + delta);
  else ex.rirDone[k] = Math.max(0, +(Number(ex.rirDone[k] || 0) + delta).toFixed(1));
  saveState();
  renderActiveSession();
}

function updateExWeight(sIdx, eIdx, val) {
  getWeekData().sessions[sIdx].exercises[eIdx].weight = Number(val || 0);
  saveState();
}

function updateSetData(sIdx, eIdx, k, kind, val) {
  const ex = getWeekData().sessions[sIdx].exercises[eIdx];
  if (kind === "reps") ex.repsDone[k] = Number(val || 0);
  else ex.rirDone[k] = Number(val || 0);

  renderActiveSession();
}

function estimateFromPhoto() {
  const desc = (document.getElementById("photoDesc").value || "").toLowerCase();
  const totalG = Math.max(50, Number(document.getElementById("photoWeight").value || 400));
  let kcalPer100 = 165, pPer100 = 11, cPer100 = 18, fPer100 = 5.5;
  if (desc.includes("arroz") || desc.includes("tortilla") || desc.includes("cerdo") || desc.includes("pavo")) {
    kcalPer100 = 175; pPer100 = 12.5; cPer100 = 21.0; fPer100 = 4.8;
  } else if (desc.includes("ensalada") || desc.includes("verdura")) {
    kcalPer100 = 65; pPer100 = 3.5; cPer100 = 7.0; fPer100 = 2.5;
  }
  const est = {
    kcal: Math.round((kcalPer100 * totalG) / 100),
    p: +((pPer100 * totalG) / 100).toFixed(1),
    c: +((cPer100 * totalG) / 100).toFixed(1),
    f: +((fPer100 * totalG) / 100).toFixed(1)
  };
  window._lastPhotoEst = { name: desc ? `Foto: ${desc.slice(0, 28)}` : "Plato por foto", grams: totalG, ...est };
  document.getElementById("photoEstimateResult").innerHTML = `
    <div class="diag-pill">
      <div><strong>~${totalG}g:</strong> ${est.kcal} kcal · P ${est.p}g · HC ${est.c}g · G ${est.f}g</div>
      <button class="sm success" style="margin-top:8px; width:100%;" onclick="addPhotoEstimateToLog()">Añadir a Hoy</button>
    </div>
  `;
}

  item.foodName = f.name;
  item.grams = grams;

  item.f = (f.f * grams) / 100;

function rebalanceRemainingMeals(silent = false, customTargets = null) {
  const targets = customTargets || computeTargets();
  const wd = getWeekData();
  const totalKcal = wd.meals.reduce((s, m) => s + m.items.reduce((a, b) => a + Number(b.kcal || 0), 0), 0);
  if (totalKcal <= 0) return;
  const factor = targets.kcal / totalKcal;
  wd.meals.forEach(m => m.items.forEach(it => {
    it.grams = Math.max(5, Math.round(it.grams * factor));
    it.kcal *= factor; it.p *= factor; it.c *= factor; it.f *= factor;
  }));
  saveState();
  renderDietTab();
  if (!silent) showToast("Menú reequilibrado");
}

function logMealToDiary(mIdx) {

  const meal = wd.meals[mIdx];

      grams: Math.round(it.grams), kcal: Math.round(it.kcal),
      p: +Number(it.p).toFixed(1), c: +Number(it.c).toFixed(1), f: +Number(it.f).toFixed(1)
    });
  });
  saveState();
  showToast(`"${meal.name}" registrada en Hoy`);
}

function buildGeneratedSessions(gymDaysCount, pain) {
  const sessions = [];
  const filterPain = (ex) => {
    if (pain === "rodilla" && ex.pattern === "squat") return { ...ex, name: ex.safe[0] };
    if (pain === "hombro" && (ex.pattern === "pushV" || ex.pattern === "pushH")) return { ...ex, name: ex.safe[1] || ex.safe[0] };
    if (pain === "lumbar" && ex.pattern === "hinge") return { ...ex, name: ex.safe[0] };
    if (pain === "fascitis" && ex.pattern === "calf") return { ...ex, name: "Gemelo sentado (3s pausa)" };
    return ex;
  };
  for (let i = 1; i <= gymDaysCount; i++) {
    const keys = gymDaysCount === 3
      ? (i === 1 ? ["squat", "pushH", "pullH", "hinge", "pushV"] : i === 2 ? ["hinge", "pullV", "pushH", "pullH", "calf"] : ["squat", "pullV", "pushV", "hinge", "calf"])
      : (i % 2 === 1 ? ["pushH", "pullH", "pushV", "pullV", "calf"] : ["squat", "hinge", "pushH", "pullH", "calf"]);
    sessions.push({
      id: "s_" + i + "_" + Date.now(),
      title: `Sesión ${i} (${gymDaysCount === 3 ? "Fullbody" : (i % 2 === 1 ? "Torso" : "Pierna")})`,
      exercises: keys.map((k, idx) => {
        const base = filterPain(EXERCISE_BANK[k]);
        return {
          id: "ex_" + i + "_" + idx + "_" + Math.random().toString(36).slice(2, 5),
          name: base.name, pattern: base.pattern, sets: 3,
          repRange: base.repRange, rirTarget: base.rir, tempo: base.tempo,
          weight: 20, repsDone: [8, 8, 8], rirDone: [2, 2, 2], notes: ""
        };
      })
    });
  }
  return sessions;
}

function buildGeneratedMeals(targets) {
  const slots = [
    { name: "Desayuno", ratio: 0.22 },
    { name: "Comida", ratio: 0.36 },
    { name: "Merienda", ratio: 0.14 },
    { name: "Cena", ratio: 0.28 }
  ];
  return slots.map((s, i) => ({
    id: "m_" + i + "_" + Date.now(),
    name: s.name,
    items: [
      {
        id: "mi_" + i + "_1",
        foodName: i === 1 ? "Arroz blanco (en seco)" : i === 0 ? "Copos de avena suaves" : "Patata cocida / asada",
        grams: Math.max(40, Math.round((targets.carbs * s.ratio) / 0.65)),
        kcal: Math.round(targets.kcal * s.ratio * 0.52),
        p: Math.round(targets.protein * s.ratio * 0.25),
        c: Math.round(targets.carbs * s.ratio * 0.8),
        f: Math.round(targets.fat * s.ratio * 0.2)
      },
      {
        id: "mi_" + i + "_2",
        foodName: i === 1 ? "Magro de cerdo / lomo" : i === 3 ? "Chuleta / filete de pavo" : "Queso fresco batido 0%",
        grams: Math.round((targets.protein * s.ratio) / 0.22),
        kcal: Math.round(targets.kcal * s.ratio * 0.48),
        p: Math.round(targets.protein * s.ratio * 0.75),
        c: Math.round(targets.carbs * s.ratio * 0.2),
        f: Math.round(targets.fat * s.ratio * 0.8)
      }
    ]
  }));
}

function generateOrUpdatePlan(fromScratch) {
  state.profile.sex = document.getElementById("f_sex").value;
  state.profile.age = Number(document.getElementById("f_age").value || 35);
  state.profile.weight = Number(document.getElementById("f_weight").value || 80);
  state.profile.height = Number(document.getElementById("f_height").value || 172);
  state.profile.goal = document.getElementById("f_goal").value;
  state.profile.gymDays = Number(document.getElementById("f_gymDays").value || 3);
  state.profile.sports = document.getElementById("f_sports").value.trim();
  state.profile.sportPausedWeek = document.getElementById("f_sportPaused").value === "pausado";

  const wd = getWeekData();
  const targets = computeTargets();
  if (fromScratch || !wd.sessions.length) wd.sessions = buildGeneratedSessions(state.profile.gymDays, state.profile.pain);
  if (fromScratch || !wd.meals.length) wd.meals = buildGeneratedMeals(targets);
  else rebalanceRemainingMeals(true, targets);

  saveState();
  showToast(fromScratch ? "Plan reiniciado" : "Ajustes guardados");
}

function adjustPlanIncremental() {
  const wd = getWeekData();
  const pain = state.profile.pain;
  wd.sessions.forEach(sess => sess.exercises.forEach(ex => {
    if (pain === "rodilla" && ex.pattern === "squat") ex.name = "Prensa de piernas";
    if (pain === "hombro" && (ex.pattern === "pushV" || ex.pattern === "pushH")) ex.name = "Elevaciones laterales polea";
    if (pain === "lumbar" && ex.pattern === "hinge") ex.name = "Curl femoral tumbado";
    if (pain === "fascitis" && ex.pattern === "calf") ex.name = "Gemelo sentado (3s pausa)";
  }));
  if (wd.meals.length) rebalanceRemainingMeals(true, computeTargets());
  saveState();
  renderHoyTab();
  showToast("Plan ajustado manteniendo progreso");
}

}

  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      state = JSON.parse(reader.result);
      saveState();
      closeModal();
      syncFormFromState();
      renderHoyTab();
      showToast("Backup restaurado");
    } catch (e) { showToast("Archivo inválido"); }
  };
  reader.readAsText(file);
}

/* INIT */
syncFormFromState();
renderHoyTab();
</script>
</body>
</html>
